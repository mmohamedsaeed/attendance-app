<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance System</title>
<meta name="theme-color" content="#4f46e5">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f1f5f9;color:#1e293b;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
.card{background:#fff;width:100%;max-width:440px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden}
.header{background:linear-gradient(135deg,#4f46e5,#3b82f6);color:#fff;padding:24px 20px;text-align:center}
.header h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}.header p{font-size:.85rem;opacity:.9}
.content{padding:20px}
.view{display:none}.view.active{display:block}
.hero{text-align:center;padding:10px 0 6px}
.hero .ico{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:#eef2ff;color:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.hero h2{font-size:1.2rem;margin-bottom:6px}.hero p{font-size:.88rem;color:#64748b;margin-bottom:18px}
.steps{list-style:none;margin:0 0 20px;text-align:right}
.steps li{display:flex;gap:10px;align-items:center;padding:9px 0;font-size:.88rem;color:#475569;border-bottom:1px solid #f1f5f9}
.steps i{color:#4f46e5;width:20px;text-align:center}
.fg{margin-bottom:16px}.fg label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:#475569}
.iw{position:relative}.iw i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#94a3b8}
.fc{width:100%;padding:12px 42px 12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.95rem;outline:none;background:#fff}
.fc:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}
select.fc{-webkit-appearance:none;appearance:none;background:#fff url('data:image/svg+xml;utf8,<svg fill="%23475569" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>') no-repeat left 12px center/18px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;color:#fff}
.b-pri{background:#4f46e5}.b-in{background:#16a34a}.b-out{background:#dc2626}
.btn:disabled{background:#cbd5e1;cursor:not-allowed}
.link{display:block;text-align:center;margin-top:14px;font-size:.85rem;color:#64748b;text-decoration:none}
.cam{position:relative;width:100%;height:240px;border-radius:16px;overflow:hidden;background:#000;margin-bottom:14px;border:2px solid #e2e8f0}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.badge{padding:10px 14px;border-radius:10px;font-size:.85rem;font-weight:600;text-align:center;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.bad{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.warn{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{font-size:.72rem;color:#94a3b8;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="header"><h1><i class="fa-solid fa-user-check"></i> Attendance System</h1><p>نظام الحضور والانصراف</p></div>
  <div class="content">

    <!-- Landing -->
    <div id="vLanding" class="view active">
      <div class="hero">
        <div class="ico"><i class="fa-solid fa-fingerprint"></i></div>
        <h2>أهلاً بك 👋</h2>
        <p>سجّل حضورك وانصرافك من أي فرع في خطوات بسيطة</p>
      </div>
      <ul class="steps">
        <li><i class="fa-solid fa-right-to-bracket"></i> سجّل الدخول برقم الموبايل وكلمة السر</li>
        <li><i class="fa-solid fa-location-dot"></i> اختر فرعك وتأكد إنك داخل النطاق</li>
        <li><i class="fa-solid fa-camera"></i> هتتصور تلقائياً لحظة التسجيل</li>
      </ul>
      <button class="btn b-pri" id="startBtn"><i class="fa-solid fa-arrow-left"></i> ابدأ الآن</button>
    </div>

    <!-- Login -->
    <div id="vLogin" class="view">
      <div id="loginMsg" class="badge bad" style="display:none"></div>
      <form id="loginForm">
        <div class="fg"><label>رقم الموبايل</label><div class="iw"><i class="fa-solid fa-phone"></i>
          <input type="tel" id="phone" class="fc" placeholder="01XXXXXXXXX" required autocomplete="username"></div></div>
        <div class="fg"><label>كلمة السر</label><div class="iw"><i class="fa-solid fa-lock"></i>
          <input type="password" id="pass" class="fc" placeholder="••••••••" required autocomplete="current-password"></div></div>
        <button type="submit" id="loginBtn" class="btn b-pri"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</button>
      </form>
      <a href="#" class="link" id="backLink">رجوع</a>
    </div>

    <!-- App -->
    <div id="vApp" class="view">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.85rem">
        <span>👤 <b id="empName">-</b></span>
        <a href="#" id="logoutLink" style="color:#ef4444;text-decoration:none;font-weight:600"><i class="fa-solid fa-power-off"></i> خروج</a>
      </div>
      <div class="fg"><div class="iw"><i class="fa-solid fa-location-dot"></i>
        <select id="branch" class="fc"><option value="">جاري تحميل الفروع...</option></select></div></div>
      <div class="cam"><video id="cam" autoplay playsinline muted></video></div>
      <div id="geo" class="badge warn"><i class="fa-solid fa-spinner fa-spin"></i><span>جاري تحديد موقعك...</span></div>
      <div class="row">
        <button class="btn b-in" id="inBtn" disabled><i class="fa-solid fa-right-to-bracket"></i> حضور</button>
        <button class="btn b-out" id="outBtn" disabled><i class="fa-solid fa-right-from-bracket"></i> انصراف</button>
      </div>
      <div id="result" class="badge" style="display:none;margin:14px 0 0"></div>
    </div>

    <div class="tag">Device: <span id="devTag"></span></div>
  </div>
</div>

<script>
// ===== الإعداد: رابط الـ Web App من Apps Script (Deploy > Web app) =====
const API = "https://script.google.com/macros/s/AKfycbwdC574RoXPMi6iv2Koya4W56q347V44Ral54EGClMs7I_Eo1XYTjCAQBozetxz6WY/exec";

const $ = id => document.getElementById(id);
const ERR = {
  BAD_LOGIN: "رقم الموبايل أو كلمة السر غير صحيحة",
  LOCKED: "تم إيقاف المحاولات مؤقتاً، حاول بعد 15 دقيقة",
  DEVICE: "🛑 هذا الحساب مرتبط بجهاز آخر. تم إبلاغ الإدارة.",
  SESSION: "انتهت الجلسة، سجّل دخولك مرة أخرى",
  FAR: "أنت خارج نطاق الفرع المختار",
  GPS: "تعذر تحديد موقعك، فعّل الـ GPS وأعد المحاولة",
  GPS_WEAK: "إشارة الـ GPS ضعيفة، اخرج لمكان مفتوح وحاول تاني",
  NO_PHOTO: "تعذر التقاط الصورة، حاول مرة أخرى",
  DUP: "تم تسجيل نفس الحركة منذ لحظات",
  BRANCH: "الفرع غير معروف",
  MAKE: "تعذر إرسال البيانات للنظام، حاول مرة أخرى",
  NETWORK: "تعذر الاتصال بالخادم، تأكد من الإنترنت وأعد المحاولة"
};

const dev = localStorage.getItem("dev") || (() => { const v = crypto.randomUUID(); localStorage.setItem("dev", v); return v; })();
$("devTag").textContent = dev.slice(0, 8) + "...";
let S = JSON.parse(localStorage.getItem("sess") || "null"); // {token,name}
let stream = null, watchId = null, pos = null, branches = [], busy = false;

// بنبعت بدون Content-Type عشان نتفادى مشاكل CORS مع Apps Script
async function api(fn, data) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify({ fn, device: dev, token: S && S.token, ...data }) });
  if (!r.ok) throw new Error("NETWORK");
  const j = await r.json();
  if (j.error) { const e = new Error(j.error); e.data = j; throw e; }
  return j;
}
function show(id) { document.querySelectorAll(".view").forEach(v => v.classList.remove("active")); $(id).classList.add("active"); }
function badge(el, cls, icon, msg) {
  el.className = "badge " + cls; el.style.display = "flex";
  el.innerHTML = `<i class="fa-solid ${icon}"></i><span></span>`; el.lastChild.textContent = msg;
}
function hav(a, b, c, d) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// المسافة: أكتر من 999 متر تتعرض بالكيلو متر
const fmt = m => m > 999 ? +(m / 1000).toFixed(2) + " كم" : m + " متر";

// ===== Landing / Login =====
$("startBtn").onclick = () => show("vLogin");
$("backLink").onclick = e => { e.preventDefault(); show("vLanding"); };
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("loginBtn"); btn.disabled = true; $("loginMsg").style.display = "none";
  try {
    const r = await api("login", { phone: $("phone").value.trim(), password: $("pass").value, ua: navigator.userAgent });
    S = { token: r.token, name: r.name }; localStorage.setItem("sess", JSON.stringify(S));
    $("pass").value = ""; enterApp();
  } catch (err) { badge($("loginMsg"), "bad", "fa-circle-xmark", ERR[err.message] || ERR.NETWORK); }
  finally { btn.disabled = false; }
});
$("logoutLink").onclick = e => { e.preventDefault(); logout(); };
function logout() { localStorage.removeItem("sess"); S = null; stopAll(); show("vLanding"); }

// ===== شاشة التسجيل =====
async function enterApp() {
  $("empName").textContent = S.name; show("vApp"); $("result").style.display = "none";
  try { branches = (await api("branches")).branches; }
  catch (err) {
    if (err.message === "SESSION") { alert(ERR.SESSION); return logout(); }
    return badge($("geo"), "bad", "fa-circle-xmark", ERR[err.message] || ERR.NETWORK);
  }
  const sel = $("branch"); sel.innerHTML = "";
  sel.add(new Option("اختر الفرع", ""));
  branches.forEach(b => sel.add(new Option(b.name, b.name)));
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
    $("cam").srcObject = stream;
  } catch (err) { return badge($("geo"), "bad", "fa-video-slash", "الكاميرا مطلوبة للتسجيل، فعّل الصلاحية وأعد تحميل الصفحة"); }
  if (!navigator.geolocation) return badge($("geo"), "bad", "fa-location-crosshairs", ERR.GPS);
  watchId = navigator.geolocation.watchPosition(
    p => { pos = p.coords; refresh(); },
    () => { pos = null; badge($("geo"), "bad", "fa-location-crosshairs", "فعّل الـ GPS وصلاحية الموقع"); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}
function stopAll() {
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
  if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null; pos = null;
}
$("branch").onchange = refresh;
function refresh() {
  const b = branches.find(x => x.name === $("branch").value);
  let can = false;
  if (!pos) badge($("geo"), "warn", "fa-spinner fa-spin", "جاري تحديد موقعك...");
  else if (!b) badge($("geo"), "info", "fa-location-dot", "اختر الفرع لحساب المسافة");
  else {
    const m = Math.round(hav(pos.latitude, pos.longitude, b.lat, b.lng));
    can = true; // التسجيل مسموح حتى خارج النطاق، لكن بيظهر تحذير بعد الإرسال
    if (m <= b.radius) badge($("geo"), "ok", "fa-circle-check", `داخل نطاق الفرع (${fmt(m)}) ✅`);
    else badge($("geo"), "warn", "fa-triangle-exclamation", `خارج نطاق الفرع، تبعد ${fmt(m)} — يمكنك التسجيل وسيظهر تحذير ⚠️`);
  }
  $("inBtn").disabled = $("outBtn").disabled = !(can && stream && !busy);
}

// ===== التصوير + الإرسال =====
function snap() {
  const v = $("cam"), c = document.createElement("canvas");
  if (!v.videoWidth) return null;
  c.width = 480; c.height = Math.round(480 * v.videoHeight / v.videoWidth);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.6);
}
async function punch(action) {
  if (busy) return;
  busy = true; refresh();
  const photo = snap();
  if (!photo) { busy = false; refresh(); return badge($("result"), "bad", "fa-circle-xmark", ERR.NO_PHOTO); }
  badge($("result"), "info", "fa-spinner fa-spin", "جاري إرسال البيانات...");
  try {
    const p = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(x => res(x.coords), rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }));
    const r = await api("punch", { branch: $("branch").value, action, lat: p.latitude, lng: p.longitude, acc: p.accuracy, photo });
    const what = action === "Check-In" ? "الحضور" : "الانصراف";
    if (r.far) badge($("result"), "warn", "fa-triangle-exclamation", `⚠️ تحذير: تم تسجيل ${what} خارج نطاق الفرع (تبعد ${fmt(r.dist)}) — ${r.time}`);
    else badge($("result"), "ok", "fa-circle-check", `✅ تم تسجيل ${what} (${r.time})`);
  } catch (err) {
    if (err.message === "SESSION") { alert(ERR.SESSION); return logout(); }
    const m = ERR[err.message] || (err.code ? ERR.GPS : ERR.NETWORK);
    badge($("result"), "bad", "fa-circle-xmark", m);
  } finally { setTimeout(() => { busy = false; refresh(); }, 2500); }
}
$("inBtn").onclick = () => punch("Check-In");
$("outBtn").onclick = () => punch("Check-Out");

if (S) enterApp(); // جلسة محفوظة
</script>
</body>
</html>
