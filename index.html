<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance System</title>
<meta name="theme-color" content="#4f46e5">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f1f5f9;color:#1e293b;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
.app-card{background:#fff;width:100%;max-width:440px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden}
.header{background:linear-gradient(135deg,#4f46e5,#3b82f6);color:#fff;padding:24px 20px;text-align:center}
.header h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}.header p{font-size:.85rem;opacity:.9}
.content{padding:20px}
.view-section{display:none}.view-section.active{display:block}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:#475569}
.input-wrapper{position:relative}
.input-wrapper i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#94a3b8}
.form-control{width:100%;padding:12px 42px 12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.95rem;outline:none}
.form-control:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}
select.form-control{-webkit-appearance:none;appearance:none;background:#fff url('data:image/svg+xml;utf8,<svg fill="%23475569" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>') no-repeat left 12px center/18px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.btn-primary{background:#4f46e5;color:#fff}.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed}
.webcam-box{position:relative;width:100%;height:260px;border-radius:16px;overflow:hidden;background:#000;margin-bottom:16px;border:2px solid #e2e8f0}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.status-badge{padding:10px 14px;border-radius:10px;font-size:.85rem;font-weight:600;text-align:center;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.status-info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.status-success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.status-danger{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.status-warning{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.device-tag{font-size:.72rem;color:#94a3b8;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="app-card">
  <div class="header"><h1><i class="fa-solid fa-user-check"></i> Attendance System</h1><p>سجل دخولك لبدء تسجيل الحضور</p></div>
  <div class="content">

    <div id="viewLogin" class="view-section active">
      <div id="loginMsg" class="status-badge status-danger" style="display:none"></div>
      <form id="loginForm">
        <div class="form-group"><label>رقم الموبايل</label><div class="input-wrapper"><i class="fa-solid fa-phone"></i>
          <input type="tel" id="loginPhone" class="form-control" placeholder="01XXXXXXXXX" required></div></div>
        <div class="form-group"><label>كلمة السر</label><div class="input-wrapper"><i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required></div></div>
        <button type="submit" id="loginBtn" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول</button>
      </form>
    </div>

    <div id="viewAttendance" class="view-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.85rem">
        <span>👤 الموظف: <b id="activeEmpName">-</b></span>
        <a href="#" id="logoutLink" style="color:#ef4444;text-decoration:none;font-weight:600"><i class="fa-solid fa-power-off"></i> خروج</a>
      </div>
      <div class="form-group"><div class="input-wrapper"><i class="fa-solid fa-location-dot"></i>
        <select id="branchSelect" class="form-control">
          <option value="El Thawra">فرع الثورة (El Thawra)</option>
          <option value="Sheraton">فرع شيراتون (Sheraton)</option>
          <option value="Nasr City">فرع مدينة نصر (Nasr City)</option>
          <option value="Mall El Arab">فرع مول العرب (Mall El Arab)</option>
          <option value="Maxim Mall">فرع مكسيم مول (Maxim Mall)</option>
          <option value="Alex">فرع الإسكندرية (Alex)</option>
        </select></div></div>
      <div class="form-group"><div class="input-wrapper"><i class="fa-solid fa-arrow-right-to-city"></i>
        <select id="actionType" class="form-control">
          <option value="Check-In">🟢 تسجيل حضور (Check-In)</option>
          <option value="Check-Out">🔴 تسجيل انصراف (Check-Out)</option>
        </select></div></div>
      <div class="webcam-box"><video id="webcam" autoplay playsinline muted></video></div>
      <div id="faceStatus" class="status-badge status-warning"><i class="fa-solid fa-spinner fa-spin"></i><span>جاري التحميل...</span></div>
      <button id="actionBtn" class="btn btn-primary" disabled></button>
    </div>

    <div class="device-tag">Device ID: <span id="displayUUID"></span></div>
  </div>
</div>

<script>
// ===== الإعدادات: من Supabase > Project Settings > API =====
const SB_URL = "https://lmjnyzkmkvknvgfvrxmb.supabase.co/rest/v1/";
const SB_KEY = "sb_publishable_qTWkfRTdkrG9wGbqDhgT0w_EjbkQrlS";
const MODELS = "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";

const $ = id => document.getElementById(id);
const ERR = {
  BAD_LOGIN: "رقم الموبايل أو كلمة السر غير صحيحة",
  LOCKED: "تم إيقاف المحاولات مؤقتاً، حاول بعد 15 دقيقة",
  DEVICE: "🛑 هذا الحساب مرتبط بجهاز آخر. تم تسجيل المحاولة وإبلاغ الإدارة.",
  SESSION: "انتهت الجلسة، سجل دخولك مرة أخرى",
  FAR: "أنت خارج نطاق الفرع المختار",
  FACE_MISMATCH: "الوجه غير مطابق لبيانات الموظف ❌",
  NO_FACE: "لم يتم تسجيل بصمة الوجه بعد",
  DUP: "تم تسجيل نفس الحركة منذ لحظات",
  NETWORK: "تعذر الاتصال بالخادم، أعد المحاولة",
  GPS: "تعذر تحديد موقعك، فعّل الـ GPS وأعد المحاولة"
};

// معرّف الجهاز (الربط الفعلي بيتم على السيرفر)
const deviceId = localStorage.getItem("dev") || (() => { const v = crypto.randomUUID(); localStorage.setItem("dev", v); return v; })();
$("displayUUID").textContent = deviceId.slice(0, 8) + "...";

let session = JSON.parse(localStorage.getItem("sess") || "null"); // {token,name,has_face} — بدون كلمة سر
let stream = null, timer = null, busy = false, lastDescriptor = null;
const modelsReady = Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
  faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),
  faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)
]);

async function rpc(fn, args) {
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args)
  });
  if (!r.ok) {
    console.error("Supabase error", r.status, await r.text());
    throw new Error("NETWORK");
  }
  return r.json();
}

function showView(id) {
  document.querySelectorAll(".view-section").forEach(e => e.classList.remove("active"));
  $(id).classList.add("active");
}
function setStatus(cls, icon, msg) {
  const b = $("faceStatus");
  b.className = "status-badge " + cls;
  b.innerHTML = `<i class="fa-solid ${icon}"></i><span></span>`;
  b.lastChild.textContent = msg;
}
function getPos() {
  return new Promise((res, rej) => navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(p => res(p.coords), () => rej(new Error("GPS")), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 })
    : rej(new Error("GPS")));
}

// ===== تسجيل الدخول =====
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("loginBtn"), msg = $("loginMsg");
  btn.disabled = true; msg.style.display = "none";
  try {
    const r = await rpc("app_login", {
      p_phone: $("loginPhone").value.trim(), p_pass: $("loginPassword").value,
      p_device: deviceId, p_ua: navigator.userAgent
    });
    if (r.error) throw new Error(r.error);
    session = { token: r.token, name: r.name, has_face: r.has_face };
    localStorage.setItem("sess", JSON.stringify(session));
    $("loginPassword").value = "";
    enter();
  } catch (err) {
    msg.textContent = ERR[err.message] || ERR.NETWORK; msg.style.display = "flex";
  } finally { btn.disabled = false; }
});

$("logoutLink").addEventListener("click", e => { e.preventDefault(); logout(); });
function logout() {
  localStorage.removeItem("sess"); session = null;
  stopCamera(); showView("viewLogin");
}

// ===== الكاميرا + كشف الوجه (Loop واحد فقط) =====
async function enter() {
  $("activeEmpName").textContent = session.name;
  showView("viewAttendance");
  refreshButton();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    $("webcam").srcObject = stream;
    await modelsReady;
  } catch (err) {
    return setStatus("status-danger", "fa-triangle-exclamation", "تعذر فتح الكاميرا أو تحميل النماذج، تأكد من الصلاحيات والاتصال.");
  }
  clearInterval(timer);
  timer = setInterval(detect, 900);
}
function stopCamera() {
  clearInterval(timer); timer = null; lastDescriptor = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}
function refreshButton() {
  $("actionBtn").innerHTML = session.has_face
    ? '<i class="fa-solid fa-camera"></i> تأكيد'
    : '<i class="fa-solid fa-face-smile"></i> تسجيل بصمة الوجه (مرة واحدة)';
}
async function detect() {
  if (busy || !session) return;
  const d = await faceapi.detectSingleFace($("webcam"), new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
  lastDescriptor = d ? d.descriptor : null;
  $("actionBtn").disabled = !d;
  if (d) setStatus("status-success", "fa-user-check", session.has_face ? "تم اكتشاف الوجه ✅" : "الوجه واضح، اضغط لتسجيل بصمتك ✅");
  else setStatus("status-warning", "fa-user-slash", "يرجى التواجد بوضوح أمام الكاميرا");
}

// ===== تسجيل الوجه / الحضور (التحقق كله على السيرفر) =====
$("actionBtn").addEventListener("click", async () => {
  if (busy || !lastDescriptor) return;
  busy = true; $("actionBtn").disabled = true;
  const face = Array.from(lastDescriptor);
  try {
    let r;
    if (!session.has_face) {
      r = await rpc("app_enroll", { p_token: session.token, p_device: deviceId, p_face: face });
      if (r.error) throw new Error(r.error);
      session.has_face = true; localStorage.setItem("sess", JSON.stringify(session)); refreshButton();
      setStatus("status-success", "fa-circle-check", "تم تسجيل بصمة الوجه، يمكنك الآن تسجيل الحضور");
    } else {
      setStatus("status-info", "fa-spinner fa-spin", "جاري تحديد الموقع وإرسال البيانات...");
      const pos = await getPos();
      r = await rpc("app_punch", {
        p_token: session.token, p_device: deviceId,
        p_branch: $("branchSelect").value, p_action: $("actionType").value,
        p_lat: pos.latitude, p_lng: pos.longitude, p_face: face
      });
      if (r.error) throw new Error(r.error);
      setStatus("status-success", "fa-circle-check", `✅ تم تسجيل ${$("actionType").value} بنجاح`);
    }
  } catch (err) {
    if (err.message === "SESSION") { alert(ERR.SESSION); return logout(); }
    setStatus("status-danger", "fa-circle-xmark", ERR[err.message] || "حدث خطأ، حاول مرة أخرى");
  } finally {
    setTimeout(() => { busy = false; }, 3000); // يمنع الضغط المتكرر
  }
});

// ===== البداية =====
if (session) enter(); else showView("viewLogin");
</script>
</body>
</html>
