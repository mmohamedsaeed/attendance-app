<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الحضور والانصراف</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f5f5f5; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    video { width: 100%; max-width: 300px; border-radius: 8px; background: #000; }
    button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
    .btn-checkin { background-color: #2e7d32; }
    .btn-checkout { background-color: #c62828; }
    #status { margin-top: 15px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <div class="card">
    <h3>تسجيل الحضور والانصراف</h3>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <button class="btn-checkin" onclick="processAttendance('Check-In')">🟢 تسجيل حضور</button>
    <button class="btn-checkout" onclick="processAttendance('Check-Out')">🔴 تسجيل انصراف</button>
    
    <p id="status"></p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');

    // رابط الـ Webhook الخاص بك في Make.com (سنقوم باستبداله لاحقاً)
    const MAKE_WEBHOOK_URL = "https://hook.us2.make.com/gm42xc9myvf6tluk16wpmufd8csxnh1a";

    // تشغيل الكاميرا الأمامية فقط
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { statusText.innerText = "تعذر الوصول للكاميرا: يرجى إعطاء الصلاحية."; });

    function processAttendance(actionType) {
      statusText.innerText = "جاري تحديد الموقع والتقاط الصورة...";

      if (!navigator.geolocation) {
        statusText.innerText = "خاصية تحديد الموقع غير مدعومة في جهازك.";
        return;
      }

      navigator.geolocation.getCurrentPosition((pos) => {
        // التقاط صورة من كاميرا الفيديو
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL('image/jpeg', 0.6); // ضغط الصورة لتقليل الحجم

        // تجهيز البيانات للترسيل
        const payload = {
          telegram_id: tg.initDataUnsafe?.user?.id || "GUEST_TEST",
          action: actionType,
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          photo: imageData
        };

        // إرسال البيانات للـ Webhook
        fetch(MAKE_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          statusText.innerText = data.message || "تم إرسال طلبك بنجاح!";
          setTimeout(() => tg.close(), 2000);
        })
        .catch(err => {
          statusText.innerText = "حدث خطأ أثناء الاتصال بالسيرفر.";
        });
      }, (err) => {
        statusText.innerText = "يرجى تفعيل الموقع الجغرافي (GPS) والموافقة على الصلاحية.";
      }, { enableHighAccuracy: true });
    }
  </script>
</body>
</html>
